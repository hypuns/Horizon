name: Finance Feishu Digest

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 00:00 UTC = 08:00 Asia/Shanghai, 04:00 UTC = 12:00 Asia/Shanghai,
    # 12:00 UTC = 20:00 Asia/Shanghai, 16:00 UTC = 00:00 Asia/Shanghai.
    - cron: "0 0,4,12,16 * * *"
  workflow_dispatch:

jobs:
  finance-feishu-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare finance config
        run: cp data/config.finance.json data/config.json

      - name: Run finance digest
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: uv run horizon --hours 30
